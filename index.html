/* VOICE  occasion: a premium product page in the manner of Apple, in LIOX logo colours
   IDEA   the machine presented like a flagship device: big cut-out, scroll-told features, real footage

   LAYOUT centred headlines over full-width pictures; alternating white/grey bands; phone stacks */
:root{color-scheme:light;--bg:#FFFFFF;--alt:#F5F5F7;--ink:#1D1D1F;--mut:#6E6E73;--b:#1B2DB0;--b2:#14228C;--bt:#EEF0FF;--o:#F26A1B;--o2:#B8470A;--line:#E3E3E8;--soft:#F5F5F7;--y:#1B2DB0;--y2:#14228C;--g:#2A2D33;--red:#B42318;--r:28px}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:Inter,system-ui,-apple-system,sans-serif;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:0}
h4{margin:0 0 10px;font-size:15px;color:var(--mut);font-weight:600}
a{color:var(--b)}
img,video{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:3px solid var(--o);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1240px;margin:0 auto}
.band{padding:clamp(64px,9vw,128px) max(5vw,16px)}
.alt{background:var(--alt)}
.sec-c{text-align:center;max-width:820px;margin:0 auto clamp(32px,5vw,56px)}
.sec-t{font-size:clamp(34px,5.4vw,64px);text-wrap:balance}
.sec-s{margin:16px auto 0;font-size:clamp(18px,1.9vw,23px);line-height:1.4;color:var(--mut);max-width:40ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:999px;border:2px solid transparent;font-weight:600;text-decoration:none;white-space:nowrap;background:none;transition:background .2s,transform .2s}
.btn:active{transform:scale(.98)}
.btn-y,.btn-b{background:var(--b);color:#fff}
.btn-y:hover,.btn-b:hover{background:var(--b2)}
.btn-o{border-color:currentColor}
.btn-sm{min-height:44px;padding:0 16px;font-size:15px}
.btn-lg{min-height:56px;padding:0 30px;font-size:18px}
.lnk{color:var(--b);font-weight:600;font-size:18px;text-decoration:none;display:inline-flex;align-items:center;min-height:44px}
.lnk:hover{text-decoration:underline}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:12px;border:1.5px solid #C7C7CC;background:#fff}
.icon-btn.round{border-radius:50%;background:#E8E8ED;border-color:transparent}
.icon-btn.round:hover{background:#DCDCE1}
.rv{opacity:0;transform:translateY(36px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.hdr{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.8);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.07);padding:6px max(5vw,16px)}
.hdr-in{display:flex;align-items:center;justify-content:space-between;gap:10px 24px;flex-wrap:wrap}
.logo{display:block;line-height:0;text-decoration:none;color:var(--b)}
.logo img{height:34px;width:auto}
.nav{display:flex;gap:26px;font-size:14px;font-weight:500}
.nav a{color:var(--ink);text-decoration:none;opacity:.85}
.nav a:hover{opacity:1;color:var(--b)}
.hdr-r{display:flex;gap:10px;align-items:center}
.hdr-tel{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--ink);text-decoration:none;font-weight:600;font-size:15px;white-space:nowrap}
.hero{position:relative;padding:clamp(36px,5vw,64px) max(5vw,16px) clamp(32px,5vw,64px);text-align:center;background:radial-gradient(110% 70% at 50% 100%,#E9ECFF 0%,#F7F8FF 38%,#FFFFFF 70%);overflow:hidden}
.hero-in{will-change:transform,opacity}
.hero-in>*{animation:up 1s cubic-bezier(.2,.7,.2,1) both}
.hero-in>*:nth-child(2){animation-delay:.08s}
.hero-in>*:nth-child(3){animation-delay:.16s}
.hero-in>*:nth-child(4){animation-delay:.24s}
@keyframes up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.h-kicker{margin:0 0 12px;font-size:clamp(17px,1.7vw,22px);font-weight:700;color:var(--o2)}
.h-title{font-size:clamp(46px,7vw,96px);letter-spacing:-.05em;line-height:1}
.h-sub{margin:18px auto 0;max-width:36ch;font-size:clamp(19px,2.1vw,26px);line-height:1.35;color:var(--mut)}
.h-cta{display:flex;gap:12px 28px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:24px}
.h-stage{position:relative;max-width:min(1000px,calc((100svh - 120px) * 1.55));margin:clamp(20px,3vw,40px) auto 0;animation:rise 1.4s .2s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(80px)}to{opacity:1;transform:none}}
.h-prod{position:relative;z-index:1;width:100%;height:auto;transform-origin:50% 85%;will-change:transform}
.h-shadow{position:absolute;left:8%;right:8%;bottom:-2%;height:9%;border-radius:50%;background:rgba(20,34,140,.28);filter:blur(22px)}
.hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:16px}
.hl-t{background:#fff;border-radius:var(--r);padding:clamp(22px,2.4vw,32px)}
.hl-n{font-weight:800;letter-spacing:-.04em;font-size:clamp(34px,3.1vw,48px);line-height:1;color:var(--b);white-space:nowrap}
.hl-n small{font-size:.42em;letter-spacing:-.01em;color:var(--ink);margin-left:4px}
.hl-t p{margin:12px 0 0;color:var(--mut);font-size:17px}
.vcard{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:16/9;background:#0E0F12;max-width:1240px;margin:0 auto;box-shadow:0 30px 60px -30px rgba(27,45,176,.45)}
.vcard video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vscrim{position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(0deg,rgba(0,0,0,.62),rgba(0,0,0,0));pointer-events:none}
.vcap{position:absolute;left:clamp(20px,4vw,48px);right:96px;bottom:clamp(20px,4vw,44px);margin:0;color:#fff;font-weight:800;letter-spacing:-.035em;font-size:clamp(26px,4.6vw,60px);line-height:1.05;text-wrap:balance}
.vcap.show{animation:up .6s cubic-bezier(.2,.7,.2,1) both}
.vbtn{position:absolute;right:clamp(14px,2.5vw,28px);bottom:clamp(14px,2.5vw,28px);width:48px;height:48px;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(255,255,255,.22);color:#fff;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.vbtn:hover{background:rgba(255,255,255,.34)}
.feat{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(28px,5vw,72px);align-items:center}
.feat-img{border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;background:#ddd}
.feat-img img{width:100%;height:100%;object-fit:cover;animation:kb 14s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.09) translate(-1.5%,-1%)}}
.feat-t .sec-t{font-size:clamp(32px,4.4vw,54px)}
.feat-t .sec-s{margin-left:0}
.ticks{list-style:none;margin:24px 0 0;padding:0;display:grid;gap:12px;font-weight:600}
.ticks li{display:flex;gap:10px;align-items:center}
.ticks svg{flex:none;color:#fff;background:var(--b);border-radius:50%;padding:3px;width:24px;height:24px}
.ins{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(28px,5vw,72px)}
.ins-stick{position:sticky;top:88px;height:min(76vh,720px);border-radius:var(--r);overflow:hidden;background:var(--alt)}
.ins-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.06);transition:opacity .7s ease,transform 1.4s cubic-bezier(.2,.7,.2,1)}
.ins-img.fit{object-fit:contain;padding:8%;background:#F0EBDD}
.ins-img.on{opacity:1;transform:none}
.st-step{min-height:74vh;display:flex;flex-direction:column;justify-content:center;opacity:.28;transition:opacity .5s}
.st-step.on{opacity:1}
.st-n{font-weight:700;color:var(--o2);font-size:15px}
.st-step h3{font-size:clamp(30px,3.6vw,46px);margin-top:10px}
.st-step p{font-size:clamp(18px,1.8vw,22px);color:var(--mut);margin:14px 0 0;max-width:30ch}
.st-mimg{display:none}
.kchart{max-width:980px;margin:0 auto 36px;overflow-x:auto}
.kc-in{display:flex;align-items:flex-end;gap:clamp(8px,2vw,22px);height:clamp(190px,24vw,280px);border-bottom:2px solid #D2D2D7;min-width:calc(var(--n) * 46px)}
.kc-col{flex:1 1 0;min-width:40px;height:100%;display:flex;flex-direction:column;justify-content:flex-end}
.kc-v{text-align:center;font-weight:800;letter-spacing:-.02em;font-size:clamp(14px,1.6vw,20px);margin-bottom:6px;white-space:nowrap}
.kc-bar{height:calc(var(--h) * .8);border:0;border-radius:14px 14px 4px 4px;background:linear-gradient(180deg,#3E50E0 0%,#1B2DB0 100%);transform-origin:50% 100%;transition:transform 1s cubic-bezier(.2,.7,.2,1),filter .2s}
.kchart.rv{transform:none}
.kchart:not(.in) .kc-bar{transform:scaleY(.02)}
.kc-col:nth-child(2) .kc-bar{transition-delay:.06s}.kc-col:nth-child(3) .kc-bar{transition-delay:.12s}.kc-col:nth-child(4) .kc-bar{transition-delay:.18s}.kc-col:nth-child(5) .kc-bar{transition-delay:.24s}.kc-col:nth-child(6) .kc-bar{transition-delay:.3s}
.kc-bar:hover,.kc-bar:focus-visible{filter:brightness(1.2)}
.kc-xl{display:flex;gap:clamp(8px,2vw,22px);min-width:calc(var(--n) * 46px)}
.kc-xl span{flex:1 1 0;min-width:40px;text-align:center;font-size:14px;font-weight:600;color:var(--mut);padding-top:8px;white-space:nowrap}
.kc-xl i{font-style:normal}
.kc-note{text-align:center;color:var(--mut);font-size:14px;margin:12px 0 0}
.tools{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-b{min-height:44px;padding:0 18px;border-radius:999px;border:0;background:#E8E8ED;font-weight:600;font-size:15px}
.chip-b[aria-pressed="true"]{background:var(--ink);color:#fff}
.arrows{display:flex;gap:10px}
.track{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px max(5vw,16px,calc((100% - 1240px) / 2)) 28px;scroll-padding-inline:max(5vw,16px,calc((100% - 1240px) / 2));scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.track>.pc{flex:0 0 min(84vw,370px);scroll-snap-align:start}
.track>.empty{flex:1 1 100%}
.pc{background:#fff;border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:transform .3s,box-shadow .3s}
.pc:hover{transform:translateY(-4px);box-shadow:0 24px 40px -24px rgba(0,0,0,.25)}
.ph{display:block;width:100%;padding:0;border:0;background:#EDEDF0;aspect-ratio:4/3;position:relative;overflow:hidden}
.ph img,.ph svg{width:100%;height:100%;object-fit:cover}
.ph img{transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.pc:hover .ph img{transform:scale(1.04)}
.stk{position:absolute;top:14px;left:14px;background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.stk.on{background:var(--b);color:#fff}
.pc-b{padding:22px 24px 24px;display:flex;flex-direction:column;gap:8px;flex:1}
.pc-k{font-size:40px;letter-spacing:-.045em}
.pc-k small{font-size:.5em;letter-spacing:-.01em}
.pc-kw{margin:0;font-weight:700;color:var(--b)}
.use{margin:0;color:var(--mut);font-size:16px}
.meter{height:6px;border-radius:3px;background:#E8E8ED;overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#3E50E0,#1B2DB0);border-radius:3px}
.pc-f{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-top:10px}
.price{font-weight:800;font-size:19px;white-space:nowrap;letter-spacing:-.02em}

.note{text-align:center;color:var(--mut);font-size:14px;margin:0}
.empty{background:#fff;border:1.5px dashed #C7C7CC;border-radius:var(--r);padding:32px;text-align:center}
.phones{display:flex;flex-wrap:wrap;gap:clamp(24px,5vw,64px);justify-content:center}
.phone{margin:0;width:min(300px,78vw);text-align:center}
.ph-scr{position:relative;aspect-ratio:9/19;border-radius:46px;background:#1D1D1F;padding:11px;box-shadow:0 40px 70px -40px rgba(27,45,176,.55),inset 0 0 0 2px #3A3A3C}

.rplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(255,255,255,.9);color:var(--b);box-shadow:0 10px 30px rgba(0,0,0,.3)}

.side-c{padding:20px 28px 28px;display:grid;gap:22px}

.cta .btn-o{color:#fff}

.cta-img{max-width:760px;margin:clamp(36px,5vw,60px) auto 0;filter:drop-shadow(0 30px 30px rgba(0,0,0,.35))}
.ftr{background:var(--alt);padding:24px max(5vw,16px);font-size:13px;color:var(--mut)}

.adm-link{border:0;background:none;color:var(--mut);text-decoration:underline;min-height:44px;padding:0;font-size:13px}
.adm-note{margin:12px 20px 0;padding:10px 14px;border-radius:10px;background:#FFF4E5;color:#8A3B00;font-size:15px}
/* order card + admin */
.ov{position:fixed;inset:0;background:rgba(29,29,31,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}

.dlg-title{font-size:30px;margin:0 52px 18px 0}
.fs{border:0;padding:0;margin:0 0 18px}

.pay input{margin:12px 0 0;accent-color:var(--b);width:18px;height:18px;flex:none}
.pay .pi{background:var(--alt)}
.qty{display:flex;align-items:center;gap:6px}
.qty output{width:48px;text-align:center;font-size:24px;font-weight:800}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding:16px 0;border-top:1px solid var(--line);margin-top:6px}
.sum strong{font-size:28px}
.big{width:100%;min-height:56px;font-size:17px}
.fine{font-size:14px;color:var(--mut);margin:10px 0 0}
.ok{display:flex;flex-direction:column;gap:14px}
.okic{width:56px;height:56px;border-radius:50%;background:#12B76A;color:#fff;display:grid;place-items:center}
.send{display:flex;flex-wrap:wrap;gap:10px}
.otext{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--alt);border-radius:12px;padding:14px;font:14px/1.5 ui-monospace,Menlo,monospace;margin:8px 0 0}
details summary{cursor:pointer;font-weight:700;min-height:32px}
.adm{position:fixed;inset:0;z-index:60;background:rgba(29,29,31,.45);display:flex;justify-content:flex-end}
.adm-p{background:#fff;width:min(840px,100%);height:100%;overflow:auto;display:flex;flex-direction:column}
.adm-h{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid var(--line);padding:14px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.adm-h h2{font-size:22px}
.adm-hb{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.badge{background:#FFF4E5;color:#8A3B00;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.adm-msg{margin:0;padding:0 20px;font-weight:600;color:var(--b)}
.adm-msg:not(:empty){padding:12px 20px 0}
.tabs{display:flex;gap:6px;padding:14px 20px 0;flex-wrap:wrap}
.tabs button{min-height:44px;padding:0 16px;border:0;border-radius:999px;background:#E8E8ED;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
.adm-b{padding:20px;display:grid;gap:14px}
.alist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.arow{border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.ar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ar-m{display:flex;gap:12px;align-items:center}
.thumb{width:64px;height:48px;border-radius:8px;overflow:hidden;flex:none;background:#EDEDF0}
.thumb img,.thumb svg{width:100%;height:100%;object-fit:cover}
.ar-m small{display:block;color:var(--mut)}
.ar-a{display:flex;gap:6px;flex-wrap:wrap}
.cfm{margin-top:10px;background:#FEF3F2;border-radius:10px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.pform{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.upl{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.upl .thumb{width:120px;height:90px}
.upl input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.hint{font-size:14px;color:var(--mut);margin-top:4px}
.chk{display:flex;gap:10px;align-items:center;min-height:44px;font-weight:600}
.chk input{width:20px;height:20px;accent-color:var(--b)}
@media(max-width:900px){.feat{grid-template-columns:minmax(0,1fr)}.ins{grid-template-columns:minmax(0,1fr)}.ins-media{display:none}.st-step{min-height:0;opacity:1;padding:20px 0 28px}.st-mimg{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:22px;margin-bottom:18px}.st-mimg.fit{object-fit:contain;background:#F0EBDD;padding:6%}}
@media(max-width:820px){.nav{display:none}}
@media(max-width:760px){.ov{padding:0}.dlg{grid-template-columns:minmax(0,1fr);border-radius:0;max-height:100%;height:100%}.dl-l .ph{aspect-ratio:auto;height:200px}.dl-r{padding:20px 16px 28px}.dl-l{padding:16px;padding-top:64px}}
@media(max-width:600px){.vcard{aspect-ratio:4/5}.vcap{right:72px}.hdr-tel span{display:none}.kc-xl i{display:none}.logo img{height:28px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

const pv = {};
const blob = (u) => (pv[u] || (/^img\/[A-Za-z0-9_.-]+$/.test(u || '') ? u : ''));

const clone = (o) => JSON.parse(JSON.stringify(o));

/* ---------- motion ---------- */
let fxObs = [];
let capIdx = 0;
const RM = () => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
const countUp = (el) => {
  const to = Number(el.dataset.to) || 0;
  if (RM()) { el.textContent = String(to); return; }
  const t0 = performance.now();
  const step = (t) => { const k = Math.min(1, (t - t0) / 1300); el.textContent = String(Math.round(to * (1 - Math.pow(1 - k, 3)))); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
};
const setStep = (i) => {
  document.querySelectorAll('.ins-img').forEach((im) => im.classList.toggle('on', Number(im.dataset.i) === i));
  document.querySelectorAll('.st-step').forEach((s) => s.classList.toggle('on', Number(s.dataset.step) === i));
};
const capTick = () => {
  const v = $('#bo-v');
  const c = $('#bo-cap');
  if (!v || !c) return;
  let i = 0;
  CAPS.forEach((x, k) => { if (v.currentTime >= x[0]) i = k; });
  if (i !== capIdx) { capIdx = i; c.classList.remove('show'); void c.offsetWidth; c.textContent = CAPS[i][1]; c.classList.add('show'); }
};
const vState = () => {
  const v = $('#bo-v');
  const b = $('#bo-btn');
  if (!v || !b) return;
  b.innerHTML = ic(v.paused ? 'play' : 'pause', 20);
  b.setAttribute('aria-label', v.paused ? 'Videoni ijro etish' : 'Videoni to‘xtatish');
};
const playReel = (k) => {
  document.querySelectorAll('video.reel').forEach((v) => { if (v.id !== 'rl-' + k) v.pause(); });
  const v = document.getElementById('rl-' + k);
  const b = document.querySelector('[data-act="reel"][data-id="' + k + '"]');
  if (!v) return;
  v.controls = true;
  v.muted = false;
  const pr = v.play();
  if (pr && pr.catch) pr.catch(() => { });
  if (b) b.hidden = true;
};
const onScroll = () => {
  ticking = false;
  if (RM()) return;
  const p = Math.min(1, Math.max(0, window.scrollY / (window.innerHeight * 0.9)));
  const img = document.getElementById('h-prod');
  const tx = document.getElementById('hero-in');
  if (img) img.style.transform = 'translate3d(0,' + (-p * 46).toFixed(1) + 'px,0) scale(' + (0.94 + p * 0.16).toFixed(3) + ')';
  if (tx) { tx.style.opacity = String(Math.max(0, 1 - p * 1.5).toFixed(3)); tx.style.transform = 'translate3d(0,' + (-p * 36).toFixed(1) + 'px,0)'; }
};
let ticking = false;
window.addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });
const initFx = () => {
  fxObs.forEach((o) => o.disconnect());
  fxObs = [];
  capIdx = 0;
  const rm = RM();
  const v = $('#bo-v');
  if (v) { v.addEventListener('timeupdate', capTick); v.addEventListener('play', vState); v.addEventListener('pause', vState); }
  if (!('IntersectionObserver' in window) || rm) {
    document.querySelectorAll('.rv').forEach((el) => el.classList.add('in'));
    return;
  }
  const io = new IntersectionObserver((es) => es.forEach((e) => {
    if (e.isIntersecting) { e.target.classList.add('in'); e.target.querySelectorAll('.cnt').forEach(countUp); io.unobserve(e.target); }
  }), { threshold: 0.12 });
  document.querySelectorAll('.rv').forEach((el) => io.observe(el));
  fxObs.push(io);
  const so = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) setStep(Number(e.target.dataset.step)); }), { rootMargin: '-45% 0px -45% 0px' });
  document.querySelectorAll('.st-step').forEach((el) => so.observe(el));
  fxObs.push(so);
  const vo = new IntersectionObserver((es) => es.forEach((e) => {
    const el = e.target;
    if (e.isIntersecting) { if (!el.dataset.user) { const pr = el.play(); if (pr && pr.catch) pr.catch(() => { }); } }
    else { el.pause(); }
  }), { threshold: 0.35 });
  document.querySelectorAll('video.auto').forEach((el) => vo.observe(el));
  fxObs.push(vo);
  onScroll();
};

const GH_KEY = 'liox-gh-v1';
const ghCfg = () => { try { return JSON.parse(localStorage.getItem(GH_KEY) || '{}') || {}; } catch (e) { return {}; } };
const ghSet = (k, v) => { const c = ghCfg(); c[k] = v; try { localStorage.setItem(GH_KEY, JSON.stringify(c)); } catch (e) { } };
const ghGuess = () => {
  const m = location.hostname.match(/^([^.]+)\.github\.io$/i);
  if (!m) return {};
  const seg = location.pathname.split('/').filter(Boolean)[0] || '';
  return { owner: m[1], repo: seg && seg.indexOf('.') < 0 ? seg : m[1] + '.github.io' };
};
const ghConf = () => { const g = ghGuess(); const c = ghCfg(); return { owner: c.owner || g.owner || '', repo: c.repo || g.repo || '', branch: c.branch || 'main', token: c.token || '' }; };
let ghStatus = '';
const gh = async (path, opts) => {
  const c = ghConf();
  if (!c.owner || !c.repo || !c.token) throw new Error('GitHub ulanishi sozlanmagan (Sozlamalar → GitHub)');
  const o = opts || {};
  const r = await fetch('https://api.github.com/repos/' + encodeURIComponent(c.owner) + '/' + encodeURIComponent(c.repo) + path, {
    method: o.method || 'GET',
    headers: { 'Authorization': 'Bearer ' + c.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json' },
    body: o.body,
    cache: 'no-store'
  });
  if (!r.ok) { let m = ''; try { m = (await r.json()).message || ''; } catch (e) { } const err = new Error(r.status + (m ? ': ' + m : '')); err.status = r.status; throw err; }
  return r.status === 204 ? null : r.json();
};
const ghPut = async (file, b64, msg) => {
  const c = ghConf();
  let sha;
  try { sha = (await gh('/contents/' + file + '?ref=' + encodeURIComponent(c.branch))).sha; } catch (e) { if (e.status !== 404) throw e; }
  const body = { message: msg, content: b64, branch: c.branch };
  if (sha) body.sha = sha;
  return gh('/contents/' + file, { method: 'PUT', body: JSON.stringify(body) });
};
const b64utf8 = (str) => { const by = new TextEncoder().encode(str); let bin = ''; for (let i = 0; i < by.length; i += 0x8000) bin += String.fromCharCode.apply(null, by.subarray(i, i + 0x8000)); return btoa(bin); };
const ghErr = (e) => { const st = e && e.status; return st === 401 ? 'Token noto‘g‘ri yoki muddati tugagan.' : st === 403 ? 'Tokenda bu repozitoriyga yozish ruxsati yo‘q (Contents: Read and write kerak).' : st === 404 ? 'Repozitoriy topilmadi: egasi va nomini tekshiring.' : st === 409 ? 'Bir vaqtda boshqa o‘zgarish saqlandi. Qayta urinib ko‘ring.' : String((e && e.message) || e); };

const toJpeg = (file) => new Promise((res, rej) => {
  const url = URL.createObjectURL(file);
  const im = new Image();
  im.onload = () => {
    const k = Math.min(1, 1600 / Math.max(im.naturalWidth, im.naturalHeight));
    const cv = document.createElement('canvas');
    cv.width = Math.round(im.naturalWidth * k); cv.height = Math.round(im.naturalHeight * k);
    cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
    res({ b64: cv.toDataURL('image/jpeg', 0.85).split(',')[1], preview: url });
  };
  im.onerror = () => rej(new Error('Rasmni o‘qib bo‘lmadi'));
  im.src = url;
});

    await ghPut(path, j.b64, 'Rasm: ' + (p.name || p.id));

  const a = t.dataset.act;
  const id = t.dataset.id;
  if (a === 'ov' || a === 'adm-ov') { if (e.target !== t) return; }
  switch (a) {
    case 'open': openOrder(id); break;
    case 'vtoggle': { const v = $('#bo-v'); if (v) { if (v.paused) { delete v.dataset.user; const pr = v.play(); if (pr && pr.catch) pr.catch(() => { }); } else { v.dataset.user = 'paused'; v.pause(); } } break; }
    case 'reel': playReel(id); break;
    case 'car': { const tr = $('#plist'); const c = tr && tr.querySelector('.pc'); if (tr) tr.scrollBy({ left: Number(id) * (c ? c.getBoundingClientRect().width + 20 : 320), behavior: RM() ? 'auto' : 'smooth' }); break; }
    case 'close': case 'ov': closeOrder(); break;
    case 'filter': filt = id; renderCatalog(); break;
    case 'otype': order.type = id; order.errs = {}; renderModal('t-' + id); break;
    case 'qty': order.qty = Math.min(50, Math.max(1, order.qty + Number(id))); renderModal(); { const q = document.querySelector('[data-act="qty"][data-id="' + id + '"]:not(:disabled)'); if (q) q.focus(); } break;
    case 'copy': copyText(); break;
    case 'reedit': order.done = null; renderModal('f-name'); break;
    case 'admin': openAdmin(); break;
    case 'adm-close': case 'adm-ov': closeAdmin(); break;
    case 'adm-tab': adminTab = id; editId = null; confirmDel = null; renderAdmin('[data-act="adm-tab"][data-id="' + id + '"]'); break;
    case 'adm-discard': draft = clone(S); lsDel(); editId = null; confirmDel = null; admMsg = 'O‘zgarishlar bekor qilindi.'; renderAdmin(); break;
    case 'adm-publish': publishDraft(); break;
    case 'gh-test': ghTest(); break;
    case 'gh-forget': ghSet('token', ''); ghStatus = 'Token bu qurilmadan o‘chirildi.'; canEdit = false; renderAdmin(); break;
    case 'dl-json': dlJson(); break;
    case 'p-add': { const p = { id: 'p' + Date.now().toString(36), name: 'Yangi generator', kva: 100, model: '', price: 0, stock: 'bor', use: '', img: '', specs: '' }; draft.products.push(p); editId = p.id; admMsg = ''; changed(); renderAdmin('#a-' + p.id + '-name'); break; }
    case 'p-edit': editId = editId === id ? null : id; confirmDel = null; renderAdmin(editId ? '#a-' + id + '-name' : null); break;
    case 'p-up': case 'p-down': { const L = draft.products; const i = L.findIndex((x) => x.id === id); const j = a === 'p-up' ? i - 1 : i + 1; if (i >= 0 && j >= 0 && j < L.length) { const tmp = L[i]; L[i] = L[j]; L[j] = tmp; changed(); renderAdmin('[data-act="' + a + '"][data-id="' + id + '"]'); } break; }
    case 'p-del': confirmDel = id; renderAdmin('[data-act="p-del-no"]'); break;
    case 'p-del-no': confirmDel = null; renderAdmin(); break;
    case 'p-del-yes': draft.products = draft.products.filter((x) => x.id !== id); confirmDel = null; if (editId === id) editId = null; changed(); renderAdmin(); break;
    case 'p-noimg': { const p = draft.products.find((x) => x.id === id); if (p) { p.img = ''; changed(); renderAdmin(); } break; }
    case 'y-add': { const x = { id: 'y' + Date.now().toString(36), name: 'Yangi to‘lov turi', desc: '', who: 'all', icon: 'wallet', on: true }; draft.payments.push(x); changed(); renderAdmin('#a-' + x.id + '-name'); break; }
    case 'y-del': draft.payments = draft.payments.filter((x) => x.id !== id); changed(); renderAdmin(); break;
  }
});

document.addEventListener('input', (e) => {
  const t = e.target;
  if (order && t.dataset && t.dataset.f) {
    order.f[t.dataset.f] = t.value;
    if (order.errs[t.dataset.f]) { delete order.errs[t.dataset.f]; t.removeAttribute('aria-invalid'); const er = document.getElementById('e-' + t.dataset.f); if (er) er.remove(); }
    return;
  }
  if (t.dataset && t.dataset.gk) { ghSet(t.dataset.gk, t.value.trim()); return; }
  if (!adminOpen || !draft || !t.dataset) return;
  if (t.dataset.pk) {
    const p = draft.products.find((x) => x.id === t.dataset.pid);
    if (!p) return;
    const k = t.dataset.pk;
    p[k] = (k === 'kva' || k === 'price') ? (t.value === '' ? 0 : Number(t.value)) : t.value;
    if (k === 'kva') { const h = document.getElementById('kwh-' + p.id); if (h) h.textContent = 'Foydali quvvat: ' + num(kwOf(p)) + ' kVt (kVA × 0,8)'; }
    changed();
  } else if (t.dataset.yk) {
    const x = draft.payments.find((y) => y.id === t.dataset.pid);
    if (!x) return;
    x[t.dataset.yk] = t.type === 'checkbox' ? t.checked : t.value;
    changed();
  } else if (t.dataset.sk) {
    draft.settings[t.dataset.sk] = t.type === 'checkbox' ? t.checked : t.value;
    changed();
  }
});

document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'sort') { sortBy = t.value; renderCatalog(); return; }
  if (order && t.name === 'pay') { order.pay = t.value; if (order.errs.pay) { delete order.errs.pay; renderModal(t.id); } return; }
  if (order && t.name === 'del') { order.del = t.value; delete order.errs.addr; renderModal(t.id); return; }
  if (t.dataset && t.dataset.up) { uploadImg(t.dataset.up, t.files && t.files[0]); return; }
  if (adminOpen && t.dataset && (t.dataset.pk || t.dataset.yk || t.dataset.sk) && (t.tagName === 'SELECT' || t.type === 'checkbox')) {
    t.dispatchEvent(new Event('input', { bubbles: true }));
  }
});

document.addEventListener('submit', (e) => {
  if (e.target && e.target.id === 'ofm') { e.preventDefault(); submitOrder(); }
});

document.addEventListener('keydown', (e) => {
  const box = order ? $('.dlg') : adminOpen ? $('.adm-p') : null;
  if (!box) return;
  if (e.key === 'Escape') { e.preventDefault(); if (order) closeOrder(); else closeAdmin(); return; }
  if (e.key === 'Tab') {
    const f = Array.from(box.querySelectorAll('a[href],button:not(:disabled),input,select,textarea,summary,[tabindex="0"]')).filter((el) => el.offsetParent !== null);
    if (!f.length) return;
    const first = f[0];
    const last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

render();
const fromHash = () => { if (location.hash === '#admin' && !adminOpen) openAdmin(); };
window.addEventListener('hashchange', fromHash);
fromHash();

canEdit = !!ghConf().token;
if (canEdit) { const h = $('.hdr'); if (h) h.outerHTML = hdr(); }
(async () => {
  try {
    const r = await fetch('catalog.json?v=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const d = await r.json();
    if (d && Array.isArray(d.products) && JSON.stringify(d) !== JSON.stringify(S)) {
      d.assets = d.assets || {}; d.settings = d.settings || {}; d.payments = d.payments || [];
      S = d;
      if (adminOpen && !isDirty()) draft = clone(S);
      render();
    }
  } catch (e) { }
})();
}
</script>
</body>
</html>
