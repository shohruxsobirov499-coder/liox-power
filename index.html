<script id="app-js">
{
const HEAD = '<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>LIOX Power katalog</title>\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Inter:wght@400;500;600;700&display=swap">';
let S;
try { S = JSON.parse(document.getElementById('store').textContent); } catch (e) { S = null; }
if (!S || !Array.isArray(S.products)) S = { v: 1, assets: {}, settings: {}, payments: [], products: [] };
S.assets = S.assets || {}; S.settings = S.settings || {}; S.payments = S.payments || [];

const $ = (s, r) => (r || document).querySelector(s);
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (n) => String(Math.round((Number(n) || 0) * 10) / 10).replace('.', ',');
const money = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' so‘m';
const digits = (s) => String(s || '').replace(/\D/g, '');
const kwOf = (p) => (Number(p.kva) || 0) * 0.8;
const pv = {};
const blob = (u) => (pv[u] || (/^img\/[A-Za-z0-9_.-]+$/.test(u || '') ? u : ''));
const uname = (s) => String(s || '').replace(/^@/, '').replace(/[^A-Za-z0-9_.]/g, '');
const clone = (o) => JSON.parse(JSON.stringify(o));
const phoneDigits = () => { const d = digits(S.settings.phone); return d.length === 9 ? '998' + d : d; };

const IC = {
  cash: '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/>',
  card: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/>',
  phone: '<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/>',
  bank: '<path d="M3 10l9-6 9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/>',
  wallet: '<path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7zM3 7l12-4v4"/><circle cx="16.5" cy="13.5" r="1.5"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  org: '<path d="M4 21V5l8-3v19M12 9h8v12M7 8h2M7 12h2M7 16h2M15 13h2M15 17h2M2 21h20"/>',
  tap: '<path d="M9 11V5a2 2 0 0 1 4 0v6M13 10a2 2 0 0 1 4 0v4a7 7 0 0 1-7 7 6 6 0 0 1-5-3l-2-4a2 2 0 0 1 3-2l2 2"/>',
  form: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  check: '<path d="M20 6L9 17l-5-5"/>',
  x: '<path d="M18 6L6 18M6 6l12 12"/>',
  bolt: '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  send: '<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>',
  copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
  call: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
  edit: '<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  up: '<path d="M12 19V5M5 12l7-7 7 7"/>',
  down: '<path d="M12 5v14M5 12l7 7 7-7"/>',
  trash: '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
  truck: '<path d="M2 6h12v10H2zM14 9h4l4 4v3h-8"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>',
  img: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/>'
};
const PAY_ICONS = ['cash', 'card', 'phone', 'bank', 'wallet'];
const ic = (n, s) => '<svg width="' + (s || 20) + '" height="' + (s || 20) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (IC[n] || '') + '</svg>';

const genArt = () => {
  let grill = '';
  for (let i = 0; i < 5; i++) grill += '<rect x="236" y="' + (128 + i * 9) + '" width="56" height="4" rx="1"/>';
  return '<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="400" height="300" fill="#E9EBEE"/><ellipse cx="200" cy="246" rx="168" ry="12" fill="#C9CDD3"/><rect x="46" y="92" width="308" height="146" rx="6" fill="#FFC20E"/><rect x="46" y="92" width="308" height="10" rx="4" fill="#E6AE00"/><rect x="126" y="110" width="88" height="108" rx="3" fill="#4A4D52"/><rect x="220" y="110" width="88" height="108" rx="3" fill="#55585E"/><g fill="#3A3D42">' + grill + '</g><rect x="46" y="226" width="308" height="16" fill="#1F2125"/><rect x="64" y="124" width="44" height="8" rx="2" fill="#1B2DB0"/><rect x="64" y="138" width="30" height="5" rx="2" fill="#1B2DB0"/></svg>';
};
const picOf = (p, alt) => blob(p.img) ? '<img src="' + blob(p.img) + '" alt="' + esc(alt || p.name) + '" loading="lazy">' : genArt();
const payOn = () => S.payments.filter((x) => x.on && x.name);
const paysFor = (t) => payOn().filter((x) => x.who === 'all' || x.who === t);
const byKva = () => S.products.slice().sort((a, b) => (a.kva || 0) - (b.kva || 0));
const specsOf = (p) => String(p.specs || '').split('\n').map((l) => { const i = l.indexOf(':'); return i > 0 ? [l.slice(0, i).trim(), l.slice(i + 1).trim()] : null; }).filter((x) => x && x[0] && x[1]);
const stockTxt = { bor: 'Omborda', buyurtma: 'Buyurtma asosida' };

let canEdit = false;
let rightsKnown = false;
let filt = 'all';
let sortBy = 'order';
let order = null;
let lastFocus = null;
let adminOpen = false;
let adminTab = 'prod';
let draft = null;
let editId = null;
let confirmDel = null;
let admMsg = '';
const LS_KEY = 'liox-draft-v1';

/* ---------- page ---------- */
const hdr = () => {
  const logo = blob(S.assets.logo);
  return '<header class="hdr"><div class="wrap hdr-in">' +
    '<a href="#top" class="logo" aria-label="LIOX Power, sahifa boshi">' + (logo ? '<img src="' + logo + '" alt="LIOX Power">' : '<span class="disp">LIOX Power</span>') + '</a>' +
    '<nav class="nav" aria-label="Bo‘limlar"><a href="#katalog">Katalog</a><a href="#buyurtma">Buyurtma</a><a href="#tolov">To‘lov</a><a href="#aloqa">Aloqa</a></nav>' +
    '<div class="hdr-r">' + (canEdit ? '<button type="button" class="btn btn-sm btn-b" data-act="admin">' + ic('edit', 18) + 'Admin panel</button>' : '') +
    '<a class="btn btn-sm btn-y" href="tel:+' + phoneDigits() + '">' + ic('call', 18) + esc(S.settings.phone) + '</a></div>' +
    '</div></header>';
};

const hero = () => {
  const ps = byKva();
  const max = Math.max(1, ...ps.map((p) => Number(p.kva) || 0));
  const min = ps.length ? ps[0].kva : 0;
  const step = max <= 120 ? 25 : max <= 450 ? 100 : max <= 1200 ? 250 : 500;
  let grid = '';
  for (let v = step; v <= max; v += step) grid += '<div class="gl" style="bottom:calc(' + (v / max * 100).toFixed(2) + ' * .82%)"><span>' + v + '</span></div>';
  const cols = ps.map((p) => {
    const h = Math.max(5, (Number(p.kva) || 0) / max * 100).toFixed(2);
    return '<div class="col"><span class="val disp">' + num(p.kva) + '</span><button type="button" class="bar" style="height:calc(' + h + ' * .82%)" data-act="open" data-id="' + esc(p.id) + '" aria-label="' + esc(p.name) + ', ' + num(p.kva) + ' kVA: kartani ochish"></button></div>';
  }).join('');
  const xl = ps.map((p) => '<span>' + num(kwOf(p)) + '<i> kVt</i></span>').join('');
  return '<section class="hero band" id="top"><div class="wrap">' +
    '<div class="hero-top"><div class="ht-l"><h1>Quvvatni tanlang, buyurtmani bitta kartada bering</h1>' +
    '<p class="lead">Ustunni yoki katalogdagi generatorni bosing: karta ochiladi. Ma’lumotlaringizni kiritasiz, to‘lov turini tanlaysiz, menejer tasdiqlaydi.</p></div>' +
    '<dl class="stats"><div><dt>Katalogda</dt><dd>' + ps.length + ' model</dd></div><div><dt>Quvvat oralig‘i</dt><dd>' + (ps.length ? num(min) + '–' + num(max) + ' kVA' : '—') + '</dd></div>' +
    '<div><dt>To‘lov turlari</dt><dd>' + payOn().length + ' xil</dd></div><div><dt>Yetkazish</dt><dd>' + esc(S.settings.delivery || '—') + '</dd></div></dl></div>' +
    (ps.length ? '<figure class="chartbox"><figcaption class="sr">Katalogdagi generatorlar quvvati, kVA</figcaption><div class="chart-scroll"><div class="chart" style="--n:' + ps.length + '">' + grid + cols + '</div><div class="xlab" style="--n:' + ps.length + '">' + xl + '</div></div>' +
    '<p class="chart-note">Ustun balandligi = to‘liq quvvat, kVA. Pastda foydali quvvat, kVt: kVA × 0,8.</p></figure>' : '') +
    '</div></section>';
};

const flow = () => {
  const names = payOn().map((x) => x.name);
  const steps = [
    ['tap', 'Generatorni tanlang', 'Grafikdagi ustunni yoki katalog kartochkasini bosing'],
    ['form', 'Ma’lumotlaringizni kiriting', 'Ism, telefon, manzil. Korxona bo‘lsa: nomi va STIR'],
    ['wallet', 'To‘lov turini tanlang', names.length ? names.join(', ') : 'Menejer bilan kelishiladi'],
    ['send', 'Buyurtmani yuboring', 'Tayyor matn sotuvchiga bir bosishda yuboriladi'],
    ['check', 'Menejer tasdiqlaydi', 'Narx, to‘lov va yetkazish vaqti kelishiladi']
  ];
  return '<section class="band" id="buyurtma"><div class="wrap"><div class="sec-h"><h2>Buyurtma 5 qadamda</h2><p>Ro‘yxatdan o‘tish shart emas. Hammasi bitta kartada.</p></div><ol class="flow">' +
    steps.map((s, i) => '<li><div class="fic">' + ic(s[0], 28) + '<b>' + (i + 1) + '</b></div><strong>' + s[1] + '</strong><span>' + esc(s[2]) + '</span></li>').join('') + '</ol></div></section>';
};

const FILTERS = [['all', 'Hammasi'], ['s', '70 kVA gacha'], ['m', '70–260 kVA'], ['l', '260 kVA dan katta']];
const inFilt = (p) => filt === 'all' || (filt === 's' && p.kva <= 70) || (filt === 'm' && p.kva > 70 && p.kva <= 260) || (filt === 'l' && p.kva > 260);

const card = (p, max, pm) => {
  const pct = Math.max(3, (Number(p.kva) || 0) / max * 100).toFixed(1);
  const st = stockTxt[p.stock];
  return '<article class="pc"><button type="button" class="ph" data-act="open" data-id="' + esc(p.id) + '" aria-label="' + esc(p.name) + ' kartasini ochish">' + picOf(p) + (st ? '<span class="stk' + (p.stock === 'bor' ? ' on' : '') + '">' + st + '</span>' : '') + '</button>' +
    '<div class="pc-b"><div class="pc-t"><h3>' + num(p.kva) + ' kVA</h3><span class="kw">' + num(kwOf(p)) + ' kVt</span></div>' +
    '<div class="pc-m">' + esc(p.name) + (p.model ? ' · ' + esc(p.model) : '') + '</div>' +
    '<div class="meter" role="img" aria-label="Quvvat: katalogdagi eng kattasining ' + Math.round(pct) + '%"><i style="width:' + pct + '%"></i></div>' +
    (p.use ? '<p class="use">' + ic('bolt', 16) + '<span>' + esc(p.use) + '</span></p>' : '') +
    '<div class="pc-f">' + (p.price > 0 ? '<span class="price">' + money(p.price) + '</span>' : '<span class="price ask">Narxi so‘rov bo‘yicha</span>') + pm + '</div>' +
    '<button type="button" class="btn btn-y" data-act="open" data-id="' + esc(p.id) + '">Buyurtma berish</button></div></article>';
};

const cards = () => {
  if (!S.products.length) return '<div class="empty"><strong>Katalog hozircha bo‘sh.</strong>' + (canEdit ? ' “Katalogni tahrirlash” tugmasi orqali birinchi mahsulotni qo‘shing.' : ' Tez orada mahsulotlar qo‘shiladi.') + '</div>';
  const max = Math.max(1, ...S.products.map((p) => Number(p.kva) || 0));
  let list = S.products.filter(inFilt);
  if (sortBy === 'kva') list = list.slice().sort((a, b) => a.kva - b.kva);
  if (sortBy === 'price') list = list.slice().sort((a, b) => (a.price > 0 ? a.price : 1e15) - (b.price > 0 ? b.price : 1e15));
  if (!list.length) return '<div class="empty"><strong>Bu oraliqda model yo‘q.</strong> <button type="button" class="btn btn-sm btn-o" data-act="filter" data-id="all">Hammasini ko‘rsatish</button></div>';
  const pays = payOn();
  const pm = pays.length ? '<span class="pm" role="img" aria-label="To‘lov: ' + esc(pays.map((x) => x.name).join(', ')) + '">' + pays.map((x) => '<span title="' + esc(x.name) + '">' + ic(x.icon, 16) + '</span>').join('') + '</span>' : '';
  return list.map((p) => card(p, max, pm)).join('');
};

const catalog = () => {
  const ps = byKva();
  return '<section class="band soft" id="katalog"><div class="wrap"><div class="sec-h"><h2>Katalog: ' + ps.length + ' model' + (ps.length ? ', ' + num(ps[0].kva) + '–' + num(ps[ps.length - 1].kva) + ' kVA' : '') + '</h2><p>Kartochkani bosing: texnik ma’lumot, narx va buyurtma formasi bitta kartada ochiladi.</p></div>' +
    '<div class="tools"><div class="chips" role="group" aria-label="Quvvat bo‘yicha saralash">' + FILTERS.map((f) => '<button type="button" class="chip-b" data-act="filter" data-id="' + f[0] + '" aria-pressed="' + (filt === f[0]) + '">' + f[1] + '</button>').join('') + '</div>' +
    '<label class="sel" for="sort">Tartib<select id="sort" data-act-change="sort"><option value="order"' + (sortBy === 'order' ? ' selected' : '') + '>Tavsiya etilgan</option><option value="kva"' + (sortBy === 'kva' ? ' selected' : '') + '>Quvvat bo‘yicha</option><option value="price"' + (sortBy === 'price' ? ' selected' : '') + '>Narx bo‘yicha</option></select></label></div>' +
    '<div class="pgrid" id="plist">' + cards() + '</div></div></section>';
};

const side = (t) => {
  const pays = paysFor(t);
  const fields = t === 'fiz' ? ['Ism va familiya', 'Telefon raqami', 'Yetkazish manzili'] : ['Korxona nomi', 'STIR (INN)', 'Mas’ul shaxs', 'Telefon raqami', 'Hisob raqami va MFO', 'Manzil'];
  return '<div class="side ' + t + '"><div class="side-h"><span class="ibig">' + ic(t === 'fiz' ? 'user' : 'org', 28) + '</span><div><h3>' + (t === 'fiz' ? 'Jismoniy shaxs' : 'Yuridik shaxs') + '</h3><p>' + (t === 'fiz' ? 'Xonadon, do‘kon egasi' : 'Korxona va tashkilotlar') + '</p></div></div>' +
    '<div class="side-c"><div><h4>Kartada kiritiladi</h4><ul class="tags">' + fields.map((f) => '<li>' + f + '</li>').join('') + '</ul></div>' +
    '<div><h4>To‘lov usullari</h4>' + (pays.length ? '<ul class="plist">' + pays.map((x) => '<li><span class="pi">' + ic(x.icon) + '</span><span><strong>' + esc(x.name) + '</strong><small>' + esc(x.desc) + '</small></span></li>').join('') + '</ul>' : '<p class="fine">Menejer bilan kelishiladi</p>') + '</div></div></div>';
};

const payInfo = () => '<section class="band" id="tolov"><div class="wrap"><div class="sec-h"><h2>To‘lov: jismoniy va yuridik shaxslar uchun</h2><p>Kartada mijoz turini tanlaysiz, forma va to‘lov usullari o‘zi moslashadi. Karta raqami so‘ralmaydi: to‘lovni menejer tasdiqlaydi.</p></div><div class="split">' + side('fiz') + side('yur') + '</div></div></section>';

const contact = () => {
  const st = S.settings;
  const ig = uname(st.instagram);
  const tg = uname(st.telegram);
  const m = blob(S.assets.machine);
  return '<section class="band blue" id="aloqa"><div class="wrap ct"><div class="ct-l"><h2>Qaysi quvvat kerakligini bilmayapsizmi? Menejer hisoblab beradi</h2><p>' + esc(st.address) + '</p>' +
    '<div class="ct-b"><a class="btn btn-y" href="tel:+' + phoneDigits() + '">' + ic('call') + esc(st.phone) + '</a>' +
    (ig ? '<a class="btn btn-o" href="https://ig.me/m/' + ig + '">Instagram Direct</a>' : '') +
    (tg ? '<a class="btn btn-o" href="https://t.me/' + tg + '">Telegram</a>' : '') + '</div></div>' +
    (m ? '<img class="ct-img" src="' + m + '" alt="LIOX Power dizel generatori">' : '') + '</div></section>';
};

const footer = () => '<footer class="ftr"><div class="wrap"><span>© ' + new Date().getFullYear() + ' LIOX Power · Generator bozor</span><span>' + esc(S.settings.address) + ' · ' + esc(S.settings.phone) + '</span><button type="button" class="adm-link" data-act="admin">Admin panel</button></div></footer>';

const app = document.getElementById('app');
const render = () => {
  app.innerHTML = hdr() + '<main>' + hero() + flow() + catalog() + payInfo() + contact() + '</main>' + footer() + '<div id="modal-root"></div><div id="admin-root"></div>';
  if (order) renderModal();
  if (adminOpen) renderAdmin();
};
const renderCatalog = () => {
  const l = $('#plist');
  if (l) l.innerHTML = cards();
  document.querySelectorAll('.chip-b').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.id === filt)));
};

/* ---------- order card ---------- */
const prodOf = (id) => S.products.find((p) => p.id === id);
const openOrder = (id) => {
  if (!prodOf(id)) return;
  lastFocus = document.activeElement;
  order = { pid: id, type: 'fiz', qty: 1, del: 'deliver', pay: '', f: {}, errs: {}, done: null };
  renderModal();
  document.body.style.overflow = 'hidden';
  setTimeout(() => { const c = $('#dlg-x'); if (c) c.focus(); }, 0);
};
const closeOrder = () => {
  order = null;
  const r = $('#modal-root');
  if (r) r.innerHTML = '';
  document.body.style.overflow = adminOpen ? 'hidden' : '';
  if (lastFocus && lastFocus.focus && document.contains(lastFocus)) lastFocus.focus();
};

const fld = (k, label, o) => {
  o = o || {};
  const e = order.errs[k];
  const input = '<input id="f-' + k + '" data-f="' + k + '" type="' + (o.type || 'text') + '"' + (o.im ? ' inputmode="' + o.im + '"' : '') + (o.ac ? ' autocomplete="' + o.ac + '"' : '') + (o.ph ? ' placeholder="' + o.ph + '"' : '') + ' value="' + esc(order.f[k] || '') + '"' + (e ? ' aria-invalid="true" aria-describedby="e-' + k + '"' : '') + (o.req ? ' required' : '') + '>';
  return '<div class="fld' + (o.wide ? ' wide' : '') + '"><label for="f-' + k + '">' + label + (o.req ? ' <span class="req" aria-hidden="true">*</span>' : '') + '</label>' +
    (o.pre ? '<div class="pre"><span>' + o.pre + '</span>' + input + '</div>' : input) + (e ? '<div class="err" id="e-' + k + '">' + e + '</div>' : '') + '</div>';
};

const fmtPhone = (s) => { let d = digits(s); if (d.length === 12 && d.indexOf('998') === 0) d = d.slice(3); return d.length === 9 ? '+998 ' + d.slice(0, 2) + ' ' + d.slice(2, 5) + ' ' + d.slice(5, 7) + ' ' + d.slice(7) : s; };
const phone9 = (s) => { let d = digits(s); if (d.length === 12 && d.indexOf('998') === 0) d = d.slice(3); return d; };

const formView = (p) => {
  const t = order.type;
  const pays = paysFor(t);
  if (!pays.find((x) => x.id === order.pay)) order.pay = pays.length ? pays[0].id : '';
  const dl = order.del === 'deliver';
  const total = p.price > 0 ? money(p.price * order.qty) : 'Narxni menejer aytadi';
  let f = '';
  if (t === 'fiz') {
    f = fld('name', 'Ism va familiya', { req: true, ac: 'name' }) + fld('phone', 'Telefon raqami', { req: true, pre: '+998', im: 'tel', ac: 'tel-national', ph: '90 123 45 67' }) +
      fld('phone2', 'Qo‘shimcha telefon', { pre: '+998', im: 'tel', ph: 'ixtiyoriy' }) + fld('city', 'Shahar / tuman', { ph: 'Toshkent' }) +
      fld('addr', dl ? 'Yetkazish manzili' : 'Manzil', { req: dl, wide: true, ac: 'street-address', ph: 'Ko‘cha, uy, mo‘ljal' });
  } else {
    f = fld('org', 'Korxona nomi', { req: true, ac: 'organization' }) + fld('stir', 'STIR (INN)', { req: true, im: 'numeric', ph: '9 ta raqam' }) +
      fld('name', 'Mas’ul shaxs', { req: true, ac: 'name' }) + fld('phone', 'Telefon raqami', { req: true, pre: '+998', im: 'tel', ph: '90 123 45 67' }) +
      fld('acct', 'Hisob raqami', { im: 'numeric', ph: '20 ta raqam, ixtiyoriy' }) + fld('mfo', 'Bank MFO', { im: 'numeric', ph: '5 ta raqam, ixtiyoriy' }) +
      fld('addr', dl ? 'Yetkazish manzili' : 'Yuridik manzil', { req: dl, wide: true, ph: 'Shahar, ko‘cha, uy' });
  }
  return '<form id="ofm" novalidate><h2 class="dlg-title" id="dlg-t">Buyurtma kartasi</h2>' +

  if (p.price > 0) L.push('Narx: ' + money(p.price) + ' · Jami: ' + money(p.price * order.qty));
  L.push('', 'Mijoz turi: ' + (order.type === 'fiz' ? 'Jismoniy shaxs' : 'Yuridik shaxs'));
  if (order.type === 'yur') { L.push('Korxona: ' + f.org, 'STIR: ' + digits(f.stir)); if (f.acct) L.push('Hisob raqami: ' + digits(f.acct)); if (f.mfo) L.push('MFO: ' + digits(f.mfo)); }

const validate = () => {
  const f = order.f;
  const e = {};
  const need = (k, m) => { if (!String(f[k] || '').trim()) e[k] = m; };
  if (order.type === 'fiz') {
    if (String(f.name || '').trim().length < 2) e.name = 'Ism va familiyangizni kiriting';
  } else {
    need('org', 'Korxona nomini kiriting');
    if (digits(f.stir).length !== 9) e.stir = 'STIR 9 ta raqamdan iborat';
    need('name', 'Mas’ul shaxsni kiriting');
    if (f.acct && digits(f.acct).length !== 20) e.acct = 'Hisob raqami 20 ta raqam';
    if (f.mfo && digits(f.mfo).length !== 5) e.mfo = 'MFO 5 ta raqam';
  }
  if (phone9(f.phone).length !== 9) e.phone = 'Telefon raqamini to‘liq kiriting: 9 ta raqam';
  if (f.phone2 && phone9(f.phone2).length !== 9) e.phone2 = 'Raqam to‘liq emas';
  if (order.del === 'deliver') need('addr', 'Yetkazish manzilini kiriting');
  if (paysFor(order.type).length && !order.pay) e.pay = 'To‘lov turini tanlang';
  return e;
};

const submitOrder = () => {
  order.errs = validate();

    renderModal();

const copyText = () => {

/* ---------- GitHub saqlash ---------- */
const GH_KEY = 'liox-gh-v1';
const ghCfg = () => { try { return JSON.parse(localStorage.getItem(GH_KEY) || '{}') || {}; } catch (e) { return {}; } };
const ghSet = (k, v) => { const c = ghCfg(); c[k] = v; try { localStorage.setItem(GH_KEY, JSON.stringify(c)); } catch (e) { } };
const ghGuess = () => {
  const m = location.hostname.match(/^([^.]+)\.github\.io$/i);
  if (!m) return {};
  const seg = location.pathname.split('/').filter(Boolean)[0] || '';
  return { owner: m[1], repo: seg && seg.indexOf('.') < 0 ? seg : m[1] + '.github.io' };
};
const ghConf = () => { const g = ghGuess(); const c = ghCfg(); return { owner: c.owner || g.owner || '', repo: c.repo || g.repo || '', branch: c.branch || 'main', token: c.token || '' }; };
let ghStatus = '';
const gh = async (path, opts) => {
  const c = ghConf();
  if (!c.owner || !c.repo || !c.token) throw new Error('GitHub ulanishi sozlanmagan (Sozlamalar → GitHub)');
  const o = opts || {};
  const r = await fetch('https://api.github.com/repos/' + encodeURIComponent(c.owner) + '/' + encodeURIComponent(c.repo) + path, {
    method: o.method || 'GET',
    headers: { 'Authorization': 'Bearer ' + c.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json' },
    body: o.body,
    cache: 'no-store'
  });
  if (!r.ok) { let m = ''; try { m = (await r.json()).message || ''; } catch (e) { } const err = new Error(r.status + (m ? ': ' + m : '')); err.status = r.status; throw err; }
  return r.status === 204 ? null : r.json();
};
const ghPut = async (file, b64, msg) => {
  const c = ghConf();
  let sha;
  try { sha = (await gh('/contents/' + file + '?ref=' + encodeURIComponent(c.branch))).sha; } catch (e) { if (e.status !== 404) throw e; }
  const body = { message: msg, content: b64, branch: c.branch };
  if (sha) body.sha = sha;
  return gh('/contents/' + file, { method: 'PUT', body: JSON.stringify(body) });
};
const b64utf8 = (str) => { const by = new TextEncoder().encode(str); let bin = ''; for (let i = 0; i < by.length; i += 0x8000) bin += String.fromCharCode.apply(null, by.subarray(i, i + 0x8000)); return btoa(bin); };
const ghErr = (e) => { const st = e && e.status; return st === 401 ? 'Token noto‘g‘ri yoki muddati tugagan.' : st === 403 ? 'Tokenda bu repozitoriyga yozish ruxsati yo‘q (Contents: Read and write kerak).' : st === 404 ? 'Repozitoriy topilmadi: egasi va nomini tekshiring.' : st === 409 ? 'Bir vaqtda boshqa o‘zgarish saqlandi. Qayta urinib ko‘ring.' : String((e && e.message) || e); };

const ghBlock = () => {
  const c = ghConf();
  return '<div class="arow" style="padding:16px"><h3 style="font-size:20px;margin-bottom:6px">GitHub ulanishi</h3>' +
    '<p class="fine" style="margin:0 0 12px">“Saqlash va e’lon qilish” katalogni shu repozitoriyga yozadi, sayt 1–2 daqiqada yangilanadi. Token faqat shu qurilma brauzerida saqlanadi va katalogga yozilmaydi.</p>' +
    '<div class="grid2" style="margin-bottom:10px">' +
    '<div class="fld"><label for="g-owner">GitHub foydalanuvchi nomi</label><input id="g-owner" data-gk="owner" value="' + esc(c.owner) + '" autocomplete="off"></div>' +
    '<div class="fld"><label for="g-repo">Repozitoriy nomi</label><input id="g-repo" data-gk="repo" value="' + esc(c.repo) + '" autocomplete="off"></div>' +
    '<div class="fld"><label for="g-branch">Branch</label><input id="g-branch" data-gk="branch" value="' + esc(c.branch) + '" autocomplete="off"></div>' +
    '<div class="fld"><label for="g-token">Token</label><input id="g-token" data-gk="token" type="password" value="' + esc(c.token) + '" autocomplete="off" placeholder="github_pat_…"></div></div>' +
    '<div class="hint" style="margin-bottom:10px">Token yaratish: <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a> → Repository access: faqat shu repozitoriy → Permissions: Contents “Read and write”.</div>' +
    '<div class="ar" style="justify-content:flex-start"><button type="button" class="btn btn-sm btn-o" data-act="gh-test">Ulanishni tekshirish</button>' +
    '<button type="button" class="btn btn-sm btn-o" data-act="gh-forget">Tokenni o‘chirish</button>' +
    '<button type="button" class="btn btn-sm btn-o" data-act="dl-json">catalog.json yuklab olish</button></div>' +
    '<p class="fine" role="status" id="gh-st" style="margin:8px 0 0">' + esc(ghStatus) + '</p></div>';
};

const publishDraft = async () => {
  if (!ghConf().token) { admMsg = 'Avval Sozlamalar → GitHub bo‘limida tokenni kiriting.'; adminTab = 'set'; renderAdmin(); return; }
  admMsg = 'Saqlanmoqda…';
  renderAdmin();
  const data = clone(draft);
  data.products.forEach((p) => { p.kva = Number(p.kva) || 0; p.price = Number(p.price) || 0; });
  try {
    await ghPut('catalog.json', b64utf8(JSON.stringify(data, null, 2) + '\n'), 'Katalog yangilandi');
    S = data;
    draft = clone(S);
    lsDel();
    admMsg = 'Saqlandi. Sayt 1–2 daqiqada hamma uchun yangilanadi.';
    render();
  } catch (e) {
    admMsg = 'Saqlanmadi: ' + ghErr(e);
    renderAdmin();
  }
};

const toJpeg = (file) => new Promise((res, rej) => {
  const url = URL.createObjectURL(file);
  const im = new Image();
  im.onload = () => {
    const k = Math.min(1, 1600 / Math.max(im.naturalWidth, im.naturalHeight));
    const cv = document.createElement('canvas');
    cv.width = Math.round(im.naturalWidth * k); cv.height = Math.round(im.naturalHeight * k);
    cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
    res({ b64: cv.toDataURL('image/jpeg', 0.85).split(',')[1], preview: url });
  };
  im.onerror = () => rej(new Error('Rasmni o‘qib bo‘lmadi'));
  im.src = url;
});

const uploadImg = async (pid, file) => {
  const p = draft.products.find((x) => x.id === pid);
  if (!p || !file) return;
  if (!/^image\//.test(file.type)) { admMsg = 'Faqat rasm fayli yuklanadi.'; renderAdmin(); return; }
  if (!ghConf().token) { admMsg = 'Rasm yuklash uchun avval Sozlamalar → GitHub bo‘limida tokenni kiriting.'; renderAdmin(); return; }
  admMsg = 'Rasm yuklanmoqda…';
  renderAdmin();
  try {
    const j = await toJpeg(file);
    const path = 'img/' + String(p.id).replace(/[^A-Za-z0-9_-]/g, '') + '-' + Date.now().toString(36) + '.jpg';
    await ghPut(path, j.b64, 'Rasm: ' + (p.name || p.id));
    pv[path] = j.preview;
    p.img = path;
    lsSet();
    admMsg = 'Rasm yuklandi. Endi “Saqlash va e’lon qilish”ni bosing.';
  } catch (e) {
    admMsg = 'Rasm yuklanmadi: ' + ghErr(e);
  }
  renderAdmin();
};

const ghTest = async () => {
  ghStatus = 'Tekshirilmoqda…';
  const st = $('#gh-st'); if (st) st.textContent = ghStatus;
  try {
    const r = await gh('');
    ghStatus = r && r.permissions && r.permissions.push ? 'Ulandi: ' + r.full_name + '. Saqlash mumkin.' : 'Repozitoriy topildi, lekin yozish ruxsati yo‘q.';
  } catch (e) { ghStatus = 'Ulanmadi: ' + ghErr(e); }
  const st2 = $('#gh-st'); if (st2) st2.textContent = ghStatus;
  canEdit = !!ghConf().token;
};

const dlJson = () => {
  const data = clone(draft || S);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2) + '\n'], { type: 'application/json' }));
  a.download = 'catalog.json';
  document.body.appendChild(a); a.click(); a.remove();
};

/* ---------- events ---------- */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const a = t.dataset.act;
  const id = t.dataset.id;
  if (a === 'ov' || a === 'adm-ov') { if (e.target !== t) return; }
  switch (a) {
    case 'open': openOrder(id); break;
    case 'close': case 'ov': closeOrder(); break;
    case 'filter': filt = id; renderCatalog(); break;
    case 'otype': order.type = id; order.errs = {}; renderModal('t-' + id); break;
    case 'qty': order.qty = Math.min(50, Math.max(1, order.qty + Number(id))); renderModal(); { const q = document.querySelector('[data-act="qty"][data-id="' + id + '"]:not(:disabled)'); if (q) q.focus(); } break;
    case 'copy': copyText(); break;
    case 'reedit': order.done = null; renderModal('f-name'); break;
    case 'admin': openAdmin(); break;
    case 'adm-close': case 'adm-ov': closeAdmin(); break;
    case 'adm-tab': adminTab = id; editId = null; confirmDel = null; renderAdmin('[data-act="adm-tab"][data-id="' + id + '"]'); break;
    case 'adm-discard': draft = clone(S); lsDel(); editId = null; confirmDel = null; admMsg = 'O‘zgarishlar bekor qilindi.'; renderAdmin(); break;
    case 'adm-publish': publishDraft(); break;
    case 'gh-test': ghTest(); break;
    case 'gh-forget': ghSet('token', ''); ghStatus = 'Token bu qurilmadan o‘chirildi.'; canEdit = false; renderAdmin(); break;
    case 'dl-json': dlJson(); break;
    case 'p-add': { const p = { id: 'p' + Date.now().toString(36), name: 'Yangi generator', kva: 100, model: '', price: 0, stock: 'bor', use: '', img: '', specs: '' }; draft.products.push(p); editId = p.id; admMsg = ''; changed(); renderAdmin('#a-' + p.id + '-name'); break; }
    case 'p-edit': editId = editId === id ? null : id; confirmDel = null; renderAdmin(editId ? '#a-' + id + '-name' : null); break;
    case 'p-up': case 'p-down': { const L = draft.products; const i = L.findIndex((x) => x.id === id); const j = a === 'p-up' ? i - 1 : i + 1; if (i >= 0 && j >= 0 && j < L.length) { const tmp = L[i]; L[i] = L[j]; L[j] = tmp; changed(); renderAdmin('[data-act="' + a + '"][data-id="' + id + '"]'); } break; }
    case 'p-del': confirmDel = id; renderAdmin('[data-act="p-del-no"]'); break;
    case 'p-del-no': confirmDel = null; renderAdmin(); break;
    case 'p-del-yes': draft.products = draft.products.filter((x) => x.id !== id); confirmDel = null; if (editId === id) editId = null; changed(); renderAdmin(); break;
    case 'p-noimg': { const p = draft.products.find((x) => x.id === id); if (p) { p.img = ''; changed(); renderAdmin(); } break; }
    case 'y-add': { const x = { id: 'y' + Date.now().toString(36), name: 'Yangi to‘lov turi', desc: '', who: 'all', icon: 'wallet', on: true }; draft.payments.push(x); changed(); renderAdmin('#a-' + x.id + '-name'); break; }
    case 'y-del': draft.payments = draft.payments.filter((x) => x.id !== id); changed(); renderAdmin(); break;
  }
});

document.addEventListener('input', (e) => {
  const t = e.target;
  if (order && t.dataset && t.dataset.f) {
    order.f[t.dataset.f] = t.value;
    if (order.errs[t.dataset.f]) { delete order.errs[t.dataset.f]; t.removeAttribute('aria-invalid'); const er = document.getElementById('e-' + t.dataset.f); if (er) er.remove(); }
    return;
  }
  if (t.dataset && t.dataset.gk) { ghSet(t.dataset.gk, t.value.trim()); return; }
  if (!adminOpen || !draft || !t.dataset) return;
  if (t.dataset.pk) {
    const p = draft.products.find((x) => x.id === t.dataset.pid);
    if (!p) return;
    const k = t.dataset.pk;
    p[k] = (k === 'kva' || k === 'price') ? (t.value === '' ? 0 : Number(t.value)) : t.value;
    if (k === 'kva') { const h = document.getElementById('kwh-' + p.id); if (h) h.textContent = 'Foydali quvvat: ' + num(kwOf(p)) + ' kVt (kVA × 0,8)'; }
    changed();
  } else if (t.dataset.yk) {
    const x = draft.payments.find((y) => y.id === t.dataset.pid);
    if (!x) return;
    x[t.dataset.yk] = t.type === 'checkbox' ? t.checked : t.value;
    changed();
  } else if (t.dataset.sk) {
    draft.settings[t.dataset.sk] = t.type === 'checkbox' ? t.checked : t.value;
    changed();
  }
});

document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'sort') { sortBy = t.value; renderCatalog(); return; }
  if (order && t.name === 'pay') { order.pay = t.value; if (order.errs.pay) { delete order.errs.pay; renderModal(t.id); } return; }
  if (order && t.name === 'del') { order.del = t.value; delete order.errs.addr; renderModal(t.id); return; }
  if (t.dataset && t.dataset.up) { uploadImg(t.dataset.up, t.files && t.files[0]); return; }
  if (adminOpen && t.dataset && (t.dataset.pk || t.dataset.yk || t.dataset.sk) && (t.tagName === 'SELECT' || t.type === 'checkbox')) {
    t.dispatchEvent(new Event('input', { bubbles: true }));
  }
});

document.addEventListener('submit', (e) => {
  if (e.target && e.target.id === 'ofm') { e.preventDefault(); submitOrder(); }
});

document.addEventListener('keydown', (e) => {
  const box = order ? $('.dlg') : adminOpen ? $('.adm-p') : null;
  if (!box) return;
  if (e.key === 'Escape') { e.preventDefault(); if (order) closeOrder(); else closeAdmin(); return; }
  if (e.key === 'Tab') {
    const f = Array.from(box.querySelectorAll('a[href],button:not(:disabled),input,select,textarea,summary,[tabindex="0"]')).filter((el) => el.offsetParent !== null);
    if (!f.length) return;
    const first = f[0];
    const last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

render();
const fromHash = () => { if (location.hash === '#admin' && !adminOpen) openAdmin(); };
window.addEventListener('hashchange', fromHash);
fromHash();

canEdit = !!ghConf().token;
if (canEdit) { const h = $('.hdr'); if (h) h.outerHTML = hdr(); }
(async () => {
  try {
    const r = await fetch('catalog.json?v=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const d = await r.json();
    if (d && Array.isArray(d.products) && JSON.stringify(d) !== JSON.stringify(S)) {
      d.assets = d.assets || {}; d.settings = d.settings || {}; d.payments = d.payments || [];
      S = d;
      if (adminOpen && !isDirty()) draft = clone(S);
      render();
    }
  } catch (e) { }
})();
}
</script>
