/* ---------- motion ---------- */
let fxObs = [];
let atsVisible = false;
const RM = () => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
const countUp = (el) => {
  const to = Number(el.dataset.to) || 0;
  if (RM()) { el.textContent = spaced(to); return; }
  const t0 = performance.now();
  const step = (t) => { const k = Math.min(1, (t - t0) / 1500); el.textContent = spaced(Math.round(to * (1 - Math.pow(1 - k, 3)))); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
};
const setStep = (i) => {
  document.querySelectorAll('.ins-img').forEach((im) => im.classList.toggle('on', Number(im.dataset.i) === i));
  document.querySelectorAll('.st-step').forEach((s) => s.classList.toggle('on', Number(s.dataset.step) === i));
};
const playReel = (k) => {
  document.querySelectorAll('video.reel').forEach((v) => { if (v.id !== 'rl-' + k) v.pause(); });
  const v = document.getElementById('rl-' + k);
  const b = document.querySelector('[data-act="reel"][data-id="' + k + '"]');
  if (!v) return;
  v.controls = true;
  v.muted = false;
  const pr = v.play();
  if (pr && pr.catch) pr.catch(() => { });
  if (b) b.hidden = true;
};
let ticking = false;
const onScroll = () => {
  ticking = false;
  if (RM()) return;
  const p = Math.min(1, Math.max(0, window.scrollY / (window.innerHeight * 0.9)));
  const img = document.getElementById('h-prod');
  const tx = document.getElementById('hero-in');
  if (img) img.style.transform = 'translate3d(0,' + (-p * 30).toFixed(1) + 'px,0) scale(' + (1 + p * 0.06).toFixed(3) + ')';
  if (tx) { tx.style.opacity = String(Math.max(0, 1 - p * 1.3).toFixed(3)); tx.style.transform = 'translate3d(0,' + (-p * 30).toFixed(1) + 'px,0)'; }
};
window.addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });
const initFx = () => {
  fxObs.forEach((o) => o.disconnect());
  fxObs = [];
  if (atsTimer) clearInterval(atsTimer);
  atsSet(atsI);
  atsPP(atsPaused);
  const rm = RM();
  if (rm) atsPP(true);
  if (!('IntersectionObserver' in window) || rm) {
    document.querySelectorAll('.rv').forEach((el) => el.classList.add('in'));
    return;
  }
  const io = new IntersectionObserver((es) => es.forEach((e) => {
    if (e.isIntersecting) { e.target.classList.add('in'); e.target.querySelectorAll('.cnt').forEach(countUp); io.unobserve(e.target); }
  }), { threshold: 0.12 });
  document.querySelectorAll('.rv').forEach((el) => io.observe(el));
  fxObs.push(io);
  const so = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) setStep(Number(e.target.dataset.step)); }), { rootMargin: '-45% 0px -45% 0px' });
  document.querySelectorAll('.st-step').forEach((el) => so.observe(el));
  fxObs.push(so);
  const ao = new IntersectionObserver((es) => es.forEach((e) => { atsVisible = e.isIntersecting; }), { threshold: 0.2 });
  const ad = document.getElementById('ats');
  if (ad) ao.observe(ad);
  fxObs.push(ao);
  atsTimer = setInterval(() => { if (!atsPaused && atsVisible && !document.hidden) atsSet((atsI + 1) % ATS_ST.length); }, 2600);
  onScroll();
};

const logoBlock = (x) => '<div class="upl" style="margin-top:10px"><span class="pi' + (blob(x.logo) ? ' lg' : '') + '">' + payIcon(x) + '</span><label class="btn btn-sm btn-o" style="position:relative">' + ic('img', 16) + 'Logotip yuklash<input type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" data-uplogo="' + esc(x.id) + '"></label>' + (x.logo ? '<button type="button" class="btn btn-sm btn-o" data-act="logo-del" data-id="' + esc(x.id) + '">Logotipni olib tashlash</button>' : '') + '</div>';
const fileB64 = (file) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = () => rej(new Error('Faylni o‘qib bo‘lmadi')); r.readAsDataURL(file); });
const uploadVideo = async (pid, file) => {
  const p = draft.products.find((x) => x.id === pid);
  if (!p || !file) return;
  if (!/^video\//.test(file.type)) { admMsg = 'Faqat video fayl yuklanadi.'; renderAdmin(); return; }
  if (file.size > 50 * 1024 * 1024) { admMsg = 'Video 50 MB dan katta. Uni siqib yuklang yoki YouTube havolasini qo‘ying.'; renderAdmin(); return; }
  if (!ghConf().token) { admMsg = 'Video yuklash uchun avval Sozlamalar → GitHub bo‘limida tokenni kiriting.'; adminTab = 'set'; renderAdmin(); return; }
  admMsg = 'Video yuklanmoqda (' + Math.max(1, Math.round(file.size / 1048576)) + ' MB). Biroz kuting…';
  renderAdmin();
  try {
    const ext = /webm/.test(file.type) ? 'webm' : /quicktime/.test(file.type) ? 'mov' : 'mp4';
    const path = 'video/' + String(p.id).replace(/[^A-Za-z0-9_-]/g, '') + '-' + Date.now().toString(36) + '.' + ext;
    await ghPut(path, await fileB64(file), 'Video: ' + (p.name || p.id));
    p.video = path;
    lsSet();
    admMsg = 'Video yuklandi. Endi “Saqlash va e’lon qilish”ni bosing. Sayt 1–2 daqiqada yangilanadi.' + (ext === 'mov' ? ' MOV ba’zi brauzerlarda ochilmasligi mumkin, MP4 yaxshiroq.' : '');
  } catch (e) { admMsg = 'Video yuklanmadi: ' + ghErr(e); }
  renderAdmin();
};
const uploadLogo = async (yid, file) => {
  const x = draft.payments.find((y) => y.id === yid);
  if (!x || !file) return;
  if (!/^image\//.test(file.type)) { admMsg = 'Faqat rasm fayli yuklanadi.'; renderAdmin(); return; }
  if (file.size > 2 * 1024 * 1024) { admMsg = 'Logotip 2 MB dan kichik bo‘lsin.'; renderAdmin(); return; }
  if (!ghConf().token) { admMsg = 'Logotip yuklash uchun avval Sozlamalar → GitHub bo‘limida tokenni kiriting.'; adminTab = 'set'; renderAdmin(); return; }
  admMsg = 'Logotip yuklanmoqda…';
  renderAdmin();
  try {
    const ext = ({ 'image/png': 'png', 'image/jpeg': 'jpg', 'image/webp': 'webp', 'image/svg+xml': 'svg', 'image/gif': 'gif' })[file.type] || 'png';
    const path = 'img/pay-' + String(x.id).replace(/[^A-Za-z0-9_-]/g, '') + '-' + Date.now().toString(36) + '.' + ext;
    await ghPut(path, await fileB64(file), 'Logotip: ' + (x.name || x.id));

    lsSet();

};

  if (order.type === 'yur') { L.push('Korxona: ' + f.org, 'STIR: ' + digits(f.stir)); if (f.acct) L.push('Hisob raqami: ' + digits(f.acct)); if (f.mfo) L.push('MFO: ' + digits(f.mfo)); }

const validate = () => {
  const f = order.f;
  const e = {};
  const need = (k, m) => { if (!String(f[k] || '').trim()) e[k] = m; };
  if (order.type === 'fiz') {
    if (String(f.name || '').trim().length < 2) e.name = 'Ism va familiyangizni kiriting';
  } else {
    need('org', 'Korxona nomini kiriting');
    if (digits(f.stir).length !== 9) e.stir = 'STIR 9 ta raqamdan iborat';
    need('name', 'Mas’ul shaxsni kiriting');
    if (f.acct && digits(f.acct).length !== 20) e.acct = 'Hisob raqami 20 ta raqam';
    if (f.mfo && digits(f.mfo).length !== 5) e.mfo = 'MFO 5 ta raqam';
  }
  if (phone9(f.phone).length !== 9) e.phone = 'Telefon raqamini to‘liq kiriting: 9 ta raqam';
  if (f.phone2 && phone9(f.phone2).length !== 9) e.phone2 = 'Raqam to‘liq emas';
  if (order.del === 'deliver') need('addr', 'Yetkazish manzilini kiriting');
  if (paysFor(order.type).length && !order.pay) e.pay = 'To‘lov turini tanlang';
  return e;
};

const submitOrder = () => {
  order.errs = validate();
  const keys = Object.keys(order.errs);
  if (keys.length) {
    renderModal();
    const first = $('#f-' + keys[0]) || $('#dlg-t');
    if (first) first.focus();
    return;
  }
  const p = prodOf(order.pid);
  const no = 'LX-' + Date.now().toString(36).slice(-5).toUpperCase();

const copyText = () => {
  const msg = $('#copy-msg');
  const t = order && order.done ? order.done.text : '';
  const fallback = () => {
    const pre = $('#otext');
    if (pre) { const rg = document.createRange(); rg.selectNodeContents(pre); const s = window.getSelection(); s.removeAllRanges(); s.addRange(rg); }
    if (msg) msg.textContent = 'Matn belgilandi: nusxalab, chatga joylashtiring.';
  };
  try {
    navigator.clipboard.writeText(t).then(() => { if (msg) msg.textContent = 'Matn nusxalandi. Chatga joylashtirib yuboring.'; }, fallback);
  } catch (e) { fallback(); }
};

/* ---------- GitHub saqlash ---------- */
const GH_KEY = 'liox-gh-v1';
const ghCfg = () => { try { return JSON.parse(localStorage.getItem(GH_KEY) || '{}') || {}; } catch (e) { return {}; } };
const ghSet = (k, v) => { const c = ghCfg(); c[k] = v; try { localStorage.setItem(GH_KEY, JSON.stringify(c)); } catch (e) { } };
const ghGuess = () => {
  const m = location.hostname.match(/^([^.]+)\.github\.io$/i);
  if (!m) return {};
  const seg = location.pathname.split('/').filter(Boolean)[0] || '';
  return { owner: m[1], repo: seg && seg.indexOf('.') < 0 ? seg : m[1] + '.github.io' };
};
const ghConf = () => { const g = ghGuess(); const c = ghCfg(); return { owner: c.owner || g.owner || '', repo: c.repo || g.repo || '', branch: c.branch || 'main', token: c.token || '' }; };
let ghStatus = '';
const gh = async (path, opts) => {
  const c = ghConf();
  if (!c.owner || !c.repo || !c.token) throw new Error('GitHub ulanishi sozlanmagan (Sozlamalar → GitHub)');
  const o = opts || {};
  const r = await fetch('https://api.github.com/repos/' + encodeURIComponent(c.owner) + '/' + encodeURIComponent(c.repo) + path, {
    method: o.method || 'GET',
    headers: { 'Authorization': 'Bearer ' + c.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json' },
    body: o.body,
    cache: 'no-store'
  });
  if (!r.ok) { let m = ''; try { m = (await r.json()).message || ''; } catch (e) { } const err = new Error(r.status + (m ? ': ' + m : '')); err.status = r.status; throw err; }
  return r.status === 204 ? null : r.json();
};
const ghPut = async (file, b64, msg) => {
  const c = ghConf();
  let sha;
  try { sha = (await gh('/contents/' + file + '?ref=' + encodeURIComponent(c.branch))).sha; } catch (e) { if (e.status !== 404) throw e; }
  const body = { message: msg, content: b64, branch: c.branch };
  if (sha) body.sha = sha;
  return gh('/contents/' + file, { method: 'PUT', body: JSON.stringify(body) });
};
const b64utf8 = (str) => { const by = new TextEncoder().encode(str); let bin = ''; for (let i = 0; i < by.length; i += 0x8000) bin += String.fromCharCode.apply(null, by.subarray(i, i + 0x8000)); return btoa(bin); };
const ghErr = (e) => { const st = e && e.status; return st === 401 ? 'Token noto‘g‘ri yoki muddati tugagan.' : st === 403 ? 'Tokenda bu repozitoriyga yozish ruxsati yo‘q (Contents: Read and write kerak).' : st === 404 ? 'Repozitoriy topilmadi: egasi va nomini tekshiring.' : st === 409 ? 'Bir vaqtda boshqa o‘zgarish saqlandi. Qayta urinib ko‘ring.' : String((e && e.message) || e); };

    '<div class="hint" style="margin-bottom:10px">Token yaratish: <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a> → Repository access: faqat shu repozitoriy → Permissions: Contents “Read and write”.</div>' +

const toJpeg = (file) => new Promise((res, rej) => {
  const url = URL.createObjectURL(file);
  const im = new Image();
  im.onload = () => {
    const k = Math.min(1, 1600 / Math.max(im.naturalWidth, im.naturalHeight));
    const cv = document.createElement('canvas');
    cv.width = Math.round(im.naturalWidth * k); cv.height = Math.round(im.naturalHeight * k);
    cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
    res({ b64: cv.toDataURL('image/jpeg', 0.85).split(',')[1], preview: url });
  };
  im.onerror = () => rej(new Error('Rasmni o‘qib bo‘lmadi'));
  im.src = url;
});

  if (!adminOpen || !draft || !t.dataset) return;
  if (t.dataset.spk !== undefined || t.dataset.spv !== undefined) {
    const p = draft.products.find((x) => x.id === t.dataset.pid);
    if (!p) return;
    if (!Array.isArray(p.specRows)) p.specRows = specRows(p).map((r) => r.slice());
    const i = Number(t.dataset.spk !== undefined ? t.dataset.spk : t.dataset.spv);
    if (!p.specRows[i]) p.specRows[i] = ['', ''];
    p.specRows[i][t.dataset.spk !== undefined ? 0 : 1] = t.value;
    delete p.specs;
    changed();
    return;
  }
  if (t.dataset.pk) {
    const p = draft.products.find((x) => x.id === t.dataset.pid);
    if (!p) return;
    const k = t.dataset.pk;
    if (k === 'kw') { p.kva = Math.round((Number(t.value) || 0) / 0.8 * 100) / 100; const h = document.getElementById('kwh-' + p.id); if (h) h.textContent = 'To‘liq quvvat: ' + num(p.kva) + ' kVA (KW ÷ 0,8)'; } else { p[k] = (k === 'price') ? (t.value === '' ? 0 : Number(t.value)) : t.value; }
    changed();
  } else if (t.dataset.yk) {
    const x = draft.payments.find((y) => y.id === t.dataset.pid);
    if (!x) return;
    x[t.dataset.yk] = t.type === 'checkbox' ? t.checked : t.value;
    changed();
  } else if (t.dataset.sk) {
    draft.settings[t.dataset.sk] = t.type === 'checkbox' ? t.checked : t.value;
    changed();
  }
});

document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'sort') { sortBy = t.value; renderCatalog(); return; }
  if (order && t.name === 'pay') { order.pay = t.value; if (order.errs.pay) { delete order.errs.pay; renderModal(t.id); } return; }
  if (order && t.name === 'del') { order.del = t.value; delete order.errs.addr; renderModal(t.id); return; }
  if (t.dataset && t.dataset.upv) { uploadVideo(t.dataset.upv, t.files && t.files[0]); return; }
  if (t.dataset && t.dataset.uplogo) { uploadLogo(t.dataset.uplogo, t.files && t.files[0]); return; }
  if (t.dataset && t.dataset.upg) { uploadGal(t.dataset.upg, Array.from(t.files || [])); return; }
  if (t.dataset && t.dataset.up) { uploadImg(t.dataset.up, t.files && t.files[0]); return; }
  if (adminOpen && t.dataset && (t.dataset.pk || t.dataset.yk || t.dataset.sk) && (t.tagName === 'SELECT' || t.type === 'checkbox')) {
    t.dispatchEvent(new Event('input', { bubbles: true }));
  }
});

document.addEventListener('submit', (e) => {
  if (e.target && e.target.id === 'ofm') { e.preventDefault(); submitOrder(); }
});

document.addEventListener('keydown', (e) => {
  const box = order ? $('.dlg') : adminOpen ? $('.adm-p') : null;
  if (!box) return;
  if (e.key === 'Escape') { e.preventDefault(); if (order) closeOrder(); else closeAdmin(); return; }
  if (e.key === 'Tab') {
    const f = Array.from(box.querySelectorAll('a[href],button:not(:disabled),input,select,textarea,summary,[tabindex="0"]')).filter((el) => el.offsetParent !== null);
    if (!f.length) return;
    const first = f[0];
    const last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

render();
const fromHash = () => { if (location.hash === '#admin' && !adminOpen) openAdmin(); };
window.addEventListener('hashchange', fromHash);
fromHash();

canEdit = !!ghConf().token;
if (canEdit) { const h = $('.hdr'); if (h) h.outerHTML = hdr(); }
(async () => {
  try {
    const r = await fetch('catalog.json?v=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const d = await r.json();
    if (d && Array.isArray(d.products) && JSON.stringify(d) !== JSON.stringify(S)) {
      d.assets = d.assets || {}; d.settings = d.settings || {}; d.payments = d.payments || [];
      S = d;
      if (adminOpen && !isDirty()) draft = clone(S);
      render();
    }
  } catch (e) { }
})();
}
</script>
</body>
</html>
